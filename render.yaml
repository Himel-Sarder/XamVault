# Render Blueprint. Creates the API service and its PostgreSQL instance together.
#
# Values marked `sync: false` are entered in the Render dashboard and never committed.

databases:
  - name: uniexam-db
    databaseName: uniexam
    user: uniexam
    plan: free

services:
  - type: web
    name: uniexam-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: uniexam-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true      # Render generates a strong secret on first deploy
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: CORS_ORIGINS
        sync: false
      - key: FIRST_ADMIN_USER_ID
        value: admin
      - key: FIRST_ADMIN_PASSWORD
        sync: false

  # Backstop for attempts whose time ran out while nobody was looking (§42). The app and
  # the read path already auto-submit; this catches the device that never came back.
  - type: cron
    name: uniexam-sweep-attempts
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    schedule: "*/5 * * * *"
    dockerCommand: python -m app.utils.sweep_attempts
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: uniexam-db
          property: connectionString
      - key: JWT_SECRET_KEY
        fromService:
          type: web
          name: uniexam-api
          envVarKey: JWT_SECRET_KEY
      - key: CORS_ORIGINS
        sync: false
