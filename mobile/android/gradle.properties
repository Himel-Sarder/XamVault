# Sized to fit an ordinary development machine. The Flutter template ships -Xmx8G with a
# 4G metaspace, which reserves more than a 8 GB laptop has: the daemon is then OOM-killed
# mid-build and reports itself as having "disappeared unexpectedly", which reads like a
# crash rather than the memory ceiling it is. 2G builds this app comfortably.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# The Kotlin compiler runs in its own daemon, separate from Gradle's, with its own heap
# that org.gradle.jvmargs above does not touch. Adding the camera plugin pushed it over,
# and the way that surfaces is not "out of memory" but
#
#   Could not close incremental caches in build/<module>/kotlin/.../caches-jvm
#
# reported against whichever module happened to be compiling -- which reads like a
# corrupt build directory rather than the memory ceiling it is. Cleaning does not help,
# because there was never anything wrong with the caches.
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m

# Incremental compilation is what maintains those caches. On a machine this size the
# bookkeeping costs more than it saves, and it is the part that fails.
kotlin.incremental=false

# One module at a time. Peak memory here is several Kotlin compilations at once, and
# this build is not slow enough to be worth the risk.
org.gradle.parallel=false
