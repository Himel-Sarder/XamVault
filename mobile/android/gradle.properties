# Sized to fit an ordinary development machine. The Flutter template ships -Xmx8G with a
# 4G metaspace, which reserves more than a 8 GB laptop has: the daemon is then OOM-killed
# mid-build and reports itself as having "disappeared unexpectedly", which reads like a
# crash rather than the memory ceiling it is. 2G builds this app comfortably.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
